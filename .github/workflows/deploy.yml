name: Deploy Admin to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Environment (dev|qa|prd)"
        type: choice
        required: true
        default: dev
        options:
          - dev
          - qa
          - prd

jobs:
  deploy:
    name: Build & Deploy Hosting (admin)
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || vars.DEPLOY_ENVIRONMENT || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Comprobar variables
        run: |
          if [[ -z "${{ vars.GCP_PROJECT_ID }}" ]]; then
            echo "::error::Define GCP_PROJECT_ID en el Environment."
            exit 1
          fi
          if [[ -z "${{ vars.FIREBASE_HOSTING_SITE_ID_ADMIN }}" ]]; then
            echo "::error::Define FIREBASE_HOSTING_SITE_ID_ADMIN (output firebase_hosting_site_id_admin de infra)."
            exit 1
          fi
          if [[ -z "${{ vars.ADMIN_BACKEND_BASE_URL }}" ]]; then
            echo "::error::Define ADMIN_BACKEND_BASE_URL (URL del backend Cloud Run del ambiente)."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
          registry-url: "https://npm.pkg.github.com"
          scope: "@jchaconm88"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_ADMIN_BACKEND_BASE_URL: ${{ vars.ADMIN_BACKEND_BASE_URL }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"

      - name: Deploy Hosting (sitio admin)
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE_ID_ADMIN }}
        run: |
          # Mapear el target "admin" → site_id real del ambiente
          firebase target:apply hosting admin "${HOSTING_SITE}" --project "${GCP_PROJECT_ID}"
          firebase deploy --project "${GCP_PROJECT_ID}" --only hosting:admin --non-interactive
